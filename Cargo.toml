[package]
name = "ostree-missing-refs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
glib = "0.20"
ostree = { version = "0.20.5", features = ["v2021_3"] }
tracing = "0.1"
